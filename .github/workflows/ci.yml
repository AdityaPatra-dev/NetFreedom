name: NetFreedom Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust Core Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Format Check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --all-targets

      - name: Run Fail-Safe Leak & Killswitch Verification
        if: runner.os == 'Linux'
        run: ./scripts/test-leak-switch.sh

  desktop-frontend:
    name: Desktop UI Build (React/TypeScript/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Web Bundle
        working-directory: apps/desktop
        run: npm run build

  android-app:
    name: Android App Build (Kotlin/Compose/NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build Android Native Libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.sdk-path }}/ndk/28.2.13676358
        run: ./scripts/build-android-libs.sh

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netfreedom-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
