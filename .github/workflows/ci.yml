name: NetFreedom Multi-Platform Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Rust Core Workspace (Linux, Windows, macOS)
  # --------------------------------------------------------------------------
  rust-core:
    name: Rust Core Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Format Check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --all-targets

      - name: Run Fail-Safe Leak & Killswitch Verification (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/test-leak-switch.sh

  # --------------------------------------------------------------------------
  # 2. Desktop Frontend (React / TypeScript / Vite)
  # --------------------------------------------------------------------------
  desktop-frontend:
    name: Desktop UI Build (React/TypeScript/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Web Bundle
        working-directory: apps/desktop
        run: npm run build

  # --------------------------------------------------------------------------
  # 3. Android Multi-ABI Build (Universal & Splits)
  # --------------------------------------------------------------------------
  android-multi-abi:
    name: Android Build (Universal Fat APK & 4 ABI Splits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          echo "Locating pre-installed Android NDK..."
          NDK_PATH=$(find ${ANDROID_HOME}/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
            NDK_PATH=$(find ${ANDROID_HOME}/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "Using Android NDK: ${NDK_PATH}"

      - name: Build Native Libraries (arm64-v8a, armeabi-v7a, x86_64, x86)
        run: ./scripts/build-android-libs.sh

      - name: Build Universal and Split APKs
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage & Verify Generated APKs
        run: |
          mkdir -p artifacts/apk
          APK_DIR="apps/android/app/build/outputs/apk/debug"

          cp "${APK_DIR}/app-universal-debug.apk" artifacts/apk/NetFreedom-universal-debug.apk
          cp "${APK_DIR}/app-arm64-v8a-debug.apk" artifacts/apk/NetFreedom-arm64-v8a-debug.apk
          cp "${APK_DIR}/app-armeabi-v7a-debug.apk" artifacts/apk/NetFreedom-armeabi-v7a-debug.apk
          cp "${APK_DIR}/app-x86_64-debug.apk" artifacts/apk/NetFreedom-x86_64-debug.apk
          cp "${APK_DIR}/app-x86-debug.apk" artifacts/apk/NetFreedom-x86-debug.apk

          cd artifacts/apk
          sha256sum NetFreedom-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Universal Fat APK
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Android-Universal-Fat-APK
          path: artifacts/apk/NetFreedom-universal-debug.apk

      - name: Upload ARM64-v8a Split APK
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Android-arm64-v8a-APK
          path: artifacts/apk/NetFreedom-arm64-v8a-debug.apk

      - name: Upload ARMeabi-v7a Split APK
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Android-armeabi-v7a-APK
          path: artifacts/apk/NetFreedom-armeabi-v7a-debug.apk

      - name: Upload x86_64 Split APK
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Android-x86_64-APK
          path: artifacts/apk/NetFreedom-x86_64-debug.apk

      - name: Upload x86 Split APK
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Android-x86-APK
          path: artifacts/apk/NetFreedom-x86-debug.apk

      - name: Upload Complete Android Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Android-All-APKs-Bundle
          path: artifacts/apk/

  # --------------------------------------------------------------------------
  # 4. Apple iOS & macOS Native Verification
  # --------------------------------------------------------------------------
  apple-ios-macos:
    name: Apple Build (iOS XCFramework & macOS Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Apple Frameworks & ByeDPI
        run: ./scripts/build-apple-frameworks.sh

      - name: Upload Apple HevSocks5Tunnel XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Apple-XCFramework
          path: dist/apple/NetFreedom-Apple-HevSocks5Tunnel.xcframework.zip

      - name: Upload macOS Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-macOS-Universal-Binary
          path: dist/apple/ciadpi-macos-universal
