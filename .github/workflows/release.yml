name: NetFreedom Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-linux:
    name: Build Linux Binaries (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binaries
        run: cargo build --release -p netfreedom-cli -p netfreedom-daemon

      - name: Package Linux Archive
        run: |
          mkdir -p dist/netfreedom-linux-x86_64
          cp target/release/netfreedom dist/netfreedom-linux-x86_64/
          cp target/release/netfreedom-daemon dist/netfreedom-linux-x86_64/
          cp scripts/netfreedom-daemon.service dist/netfreedom-linux-x86_64/
          cp scripts/org.netfreedom.policy dist/netfreedom-linux-x86_64/
          cp scripts/install-linux.sh dist/netfreedom-linux-x86_64/
          tar -czvf dist/netfreedom-linux-x86_64.tar.gz -C dist netfreedom-linux-x86_64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netfreedom-linux-x86_64
          path: dist/netfreedom-linux-x86_64.tar.gz

  build-release-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build Android Native Libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.sdk-path }}/ndk/28.2.13676358
        run: ./scripts/build-android-libs.sh

      - name: Build Release/Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy Output APK
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/NetFreedom-v1.0.0.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Android-APK
          path: dist/NetFreedom-v1.0.0.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-release-linux, build-release-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: netfreedom-linux-x86_64
          path: dist/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: NetFreedom-Android-APK
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/netfreedom-linux-x86_64.tar.gz
            dist/NetFreedom-v1.0.0.apk
          draft: false
          prerelease: false
          generate_release_notes: true
