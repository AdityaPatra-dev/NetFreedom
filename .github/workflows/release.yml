name: NetFreedom Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Linux Release (x86_64)
  # --------------------------------------------------------------------------
  build-release-linux:
    name: Build Linux Binaries & Packages (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binaries
        run: cargo build --release -p netfreedom-cli -p netfreedom-daemon

      - name: Package Linux Distribution Tarball
        run: |
          TAG="${{ github.ref_name || inputs.version_tag }}"
          ARCHIVE_DIR="netfreedom-${TAG}-linux-x86_64"
          mkdir -p "dist/${ARCHIVE_DIR}"
          cp target/release/netfreedom "dist/${ARCHIVE_DIR}/"
          cp target/release/netfreedom-daemon "dist/${ARCHIVE_DIR}/"
          cp scripts/netfreedom-daemon.service "dist/${ARCHIVE_DIR}/"
          cp scripts/org.netfreedom.policy "dist/${ARCHIVE_DIR}/"
          cp scripts/install-linux.sh "dist/${ARCHIVE_DIR}/"
          cd dist
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netfreedom-linux-x86_64
          path: dist/*.tar.gz*

  # --------------------------------------------------------------------------
  # 2. Windows Release (x86_64)
  # --------------------------------------------------------------------------
  build-release-windows:
    name: Build Windows Binaries & Driver Bundle (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Binaries
        run: cargo build --release -p netfreedom-cli -p netfreedom-daemon

      - name: Download Signed Wintun Driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive "wintun.zip" -DestinationPath "wintun-extracted"
          Copy-Item "wintun-extracted\wintun\bin\amd64\wintun.dll" -Destination "target\release\wintun.dll"

      - name: Package Windows ZIP Bundle
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name || inputs.version_tag }}"
          $DirName = "netfreedom-$Tag-windows-x86_64"
          New-Item -ItemType Directory -Path "dist\$DirName" -Force | Out-Null
          Copy-Item "target\release\netfreedom.exe" "dist\$DirName\"
          Copy-Item "target\release\netfreedom-daemon.exe" "dist\$DirName\"
          Copy-Item "target\release\wintun.dll" "dist\$DirName\"
          Copy-Item "scripts\install-windows.ps1" "dist\$DirName\"
          Compress-Archive -Path "dist\$DirName" -DestinationPath "dist\$DirName.zip"
          Get-FileHash "dist\$DirName.zip" -Algorithm SHA256 | Out-File "dist\$DirName.zip.sha256"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netfreedom-windows-x86_64
          path: dist/*.zip*

  # --------------------------------------------------------------------------
  # 3. Apple (iOS & macOS) Frameworks Release
  # --------------------------------------------------------------------------
  build-release-apple:
    name: Build Apple iOS Framework & macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile Apple XCFramework and Universal ByeDPI
        run: ./scripts/build-apple-frameworks.sh

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netfreedom-apple-release
          path: dist/apple/*

  # --------------------------------------------------------------------------
  # 4. Android Multi-ABI Release
  # --------------------------------------------------------------------------
  build-release-android:
    name: Build Android APKs (Universal & 4 ABI Splits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          echo "Locating pre-installed Android NDK..."
          NDK_PATH=$(find ${ANDROID_HOME}/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
            NDK_PATH=$(find ${ANDROID_HOME}/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "Using Android NDK: ${NDK_PATH}"

      - name: Build Android Native Libraries for all 4 ABIs
        run: ./scripts/build-android-libs.sh

      - name: Build Universal and Split APKs
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage & Rename All APK Variants
        run: |
          TAG="${{ github.ref_name || inputs.version_tag }}"
          mkdir -p dist/apks
          APK_DIR="apps/android/app/build/outputs/apk/debug"

          # Universal Fat APK
          cp "${APK_DIR}/app-universal-debug.apk" "dist/apks/NetFreedom-${TAG}-universal.apk"

          # Individual Architecture Splits
          cp "${APK_DIR}/app-arm64-v8a-debug.apk" "dist/apks/NetFreedom-${TAG}-arm64-v8a.apk"
          cp "${APK_DIR}/app-armeabi-v7a-debug.apk" "dist/apks/NetFreedom-${TAG}-armeabi-v7a.apk"
          cp "${APK_DIR}/app-x86_64-debug.apk" "dist/apks/NetFreedom-${TAG}-x86_64.apk"
          cp "${APK_DIR}/app-x86-debug.apk" "dist/apks/NetFreedom-${TAG}-x86.apk"

          cd dist/apks
          sha256sum NetFreedom-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Android Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: NetFreedom-Android-Release-APKs
          path: dist/apks/

  # --------------------------------------------------------------------------
  # 5. Publish Master Multi-Platform GitHub Release
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-release-linux, build-release-windows, build-release-apple, build-release-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: netfreedom-linux-x86_64
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: netfreedom-windows-x86_64
          path: release-assets/

      - name: Download Apple Artifacts
        uses: actions/download-artifact@v4
        with:
          name: netfreedom-apple-release
          path: release-assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NetFreedom-Android-Release-APKs
          path: release-assets/

      - name: Generate Global Release Checksums
        run: |
          cd release-assets/
          sha256sum * > MASTER_SHA256SUMS.txt 2>/dev/null || true
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version_tag }}
          name: "NetFreedom ${{ github.ref_name || inputs.version_tag }} Multi-Platform Release"
          body: |
            ## NetFreedom Release ${{ github.ref_name || inputs.version_tag }}
            
            Unified, cross-platform privacy, security, and censorship circumvention platform engineered for hostile enterprise and campus networks.
            
            ---
            
            ### 📱 Android APK Downloads
            
            | Variant | Architecture / Target | Description |
            |---|---|---|
            | **`NetFreedom-*-universal.apk`** | **Universal Fat APK (All Devices)** | **Recommended.** Contains all 4 native engines (`arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86`). |
            | **`NetFreedom-*-arm64-v8a.apk`** | **64-bit ARM** | Leanest standalone APK for modern Android smartphones (2016+). |
            | **`NetFreedom-*-armeabi-v7a.apk`** | **32-bit ARM** | Lightweight standalone APK for older 32-bit devices and wearables. |
            | **`NetFreedom-*-x86_64.apk`** | **64-bit x86** | Optimized for ChromeOS, Android-x86, and emulators. |
            | **`NetFreedom-*-x86.apk`** | **32-bit x86** | Optimized for legacy 32-bit emulators. |
            
            ---
            
            ### 🐧 Linux Distribution
            
            - **`netfreedom-*-linux-x86_64.tar.gz`**: Includes `netfreedom` CLI, `netfreedom-daemon`, systemd unit service, Polkit policy, and `install-linux.sh`.
            
            ---
            
            ### 🪟 Windows Distribution
            
            - **`netfreedom-*-windows-x86_64.zip`**: Includes `netfreedom.exe`, `netfreedom-daemon.exe`, signed `wintun.dll`, and `install-windows.ps1` service installer.
            
            ---
            
            ### 🍏 Apple (iOS & macOS)
            
            - **`NetFreedom-Apple-HevSocks5Tunnel.xcframework.zip`**: Universal Apple XCFramework compiled for physical iOS (`iphoneos-arm64`), iOS Simulator (`iphonesimulator`), and macOS.
            - **`ciadpi-macos-universal`**: Standalone universal binary for Apple Silicon & Intel Macs.
            
            ---
            *Verify all downloads using `MASTER_SHA256SUMS.txt`.*
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
