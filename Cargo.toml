[workspace]
members = [
    "crates/netfreedom-common",
    "crates/netfreedom-health",
    "crates/netfreedom-vpn",
    "crates/netfreedom-dpi",
    "crates/netfreedom-tun",
    "crates/netfreedom-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NetFreedom Architecture Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "socks"] }
boringtun = "0.7"
base64 = "0.22"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
